{% extends "base.html" %}
{% block title %}Contact{% endblock %}
{% block content %}
<h1>Say hello</h1>
<p class="lead">Questions, catering or a table for the weekend? Drop us a line.</p>
<form method="post" class="form" novalidate>
  <label>Name
    <input name="name" value="{{ form.get('name', '') }}" autocomplete="name">
    {% if errors.name %}<small class="err">{{ errors.name }}</small>{% endif %}
  </label>
  <label>Email
    <input name="email" type="email" value="{{ form.get('email', '') }}" autocomplete="email">
    {% if errors.email %}<small class="err">{{ errors.email }}</small>{% endif %}
  </label>
  <label>Message
    <textarea name="message" rows="5">{{ form.get('message', '') }}</textarea>
    {% if errors.message %}<small class="err">{{ errors.message }}</small>{% endif %}
  </label>
  <button class="btn" type="submit">Send message</button>
</form>
{% endblock %}
