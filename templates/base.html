<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Bean &amp; Brew{% endblock %} &middot; Bean &amp; Brew Cafe</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="top">
    <a class="brand" href="{{ url_for('home') }}"><span class="dot"></span>Bean &amp; Brew</a>
    <nav>
      <a href="{{ url_for('home') }}">Home</a>
      <a href="{{ url_for('menu') }}">Menu</a>
      <a href="{{ url_for('about') }}">About</a>
      <a class="cta" href="{{ url_for('contact') }}">Contact</a>
    </nav>
  </header>
  <main>{% block content %}{% endblock %}</main>
  <footer>
    <p>&copy; 2026 Bean &amp; Brew Cafe &middot; 12 Lake Road &middot; Open daily 7am &ndash; 7pm</p>
  </footer>
</body>
</html>
